{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Page Not Found · Favhost</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link href="{% static 'website/img/fev.png' %}" rel="icon" type="image/png">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #EB5310;
      --brand-dark: #d4480d;
      --ink: #313131;
      --muted: #6b7280;
    }

    html, body { height: 100%; }

    body {
      font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 520px at 50% -10%, #fff2ec 0%, rgba(255,242,236,0) 60%),
        #FAFAFA;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Platform header bar (matches the app's dark navbar) ── */
    .nf-header {
      background: var(--ink);
      border-bottom: 1px solid #2e2e2e;
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .nf-header-brand { display: inline-flex; align-items: center; }
    .nf-logo {
      height: 42px;
      width: auto;
      display: block;
    }

    /* ── Centered content area below the header ── */
    .nf-main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 56px;
    }

    .nf-card {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    /* ── Illustration ── */
    .nf-art {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .nf-art-glow {
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(235,83,16,0.14) 0%, transparent 66%);
      animation: nfGlow 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes nfGlow {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50%      { transform: scale(1.12); opacity: 1;   }
    }
    .nf-svg {
      position: relative;
      width: 240px;
      max-width: 72vw;
      height: auto;
      filter: drop-shadow(0 14px 26px rgba(49,49,49,0.16));
      animation: nfFloat 5s ease-in-out infinite, nfDrop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes nfFloat {
      0%, 100% { transform: translateY(0)    rotate(-1deg); }
      50%      { transform: translateY(-9px) rotate(1deg);  }
    }
    @keyframes nfDrop {
      from { opacity: 0; transform: scale(0.5) translateY(-16px); }
      to   { opacity: 1; transform: scale(1)   translateY(0);     }
    }
    /* Signpost swing */
    .nf-sign {
      transform-box: fill-box;
      transform-origin: 50% 8%;
      animation: nfSwing 4s ease-in-out infinite;
    }
    @keyframes nfSwing {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg);  }
    }
    /* Twinkling stars */
    .nf-star { animation: nfTwinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .nf-star--2 { animation-delay: 0.8s; }
    .nf-star--3 { animation-delay: 1.5s; }
    @keyframes nfTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50%      { opacity: 1;    transform: scale(1);   }
    }

    /* ── Text ── */
    .nf-code {
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--ink);
      margin-top: 6px;
    }
    .nf-code span { color: var(--brand); }
    .nf-title {
      font-size: 22px;
      font-weight: 700;
      margin: 14px 0 8px;
    }
    .nf-text {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 26px;
    }

    /* ── Actions ── */
    .nf-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .nf-btn:active { transform: translateY(1px); }
    .nf-btn--primary {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 8px 18px rgba(235,83,16,0.28);
    }
    .nf-btn--primary:hover { background: var(--brand-dark); }
    .nf-btn--ghost {
      background: #fff;
      color: var(--ink);
      border-color: #e5e7eb;
    }
    .nf-btn--ghost:hover { background: #f5f5f5; }

    .nf-help {
      margin-top: 28px;
      font-size: 12.5px;
      color: #9ca3af;
    }
    .nf-help a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .nf-help a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .nf-header { height: 52px; padding: 0 16px; }
      .nf-logo { height: 36px; }
      .nf-code { font-size: 68px; }
      .nf-title { font-size: 19px; }
    }
  </style>
</head>

<body>
  <header class="nf-header">
    <a href="/" class="nf-header-brand" aria-label="Favhost home">
      <img src="{% static 'img/header/favhost.png' %}" alt="Favhost" class="nf-logo">
    </a>
  </header>

  <main class="nf-main">
   <div class="nf-card">
    <div class="nf-art">
      <div class="nf-art-glow"></div>
      <svg class="nf-svg" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A lost signpost">
        <defs>
          <linearGradient id="nfGround" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe4d6"/>
            <stop offset="100%" stop-color="#ffd2bd"/>
          </linearGradient>
          <linearGradient id="nfPost" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a4a4a"/>
            <stop offset="100%" stop-color="#2b2b2b"/>
          </linearGradient>
          <linearGradient id="nfBoard" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f5641f"/>
            <stop offset="100%" stop-color="#EB5310"/>
          </linearGradient>
        </defs>

        <!-- Stars -->
        <path class="nf-star" d="M28 34 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#f5b98f"/>
        <path class="nf-star nf-star--2" d="M170 26 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#f5b98f"/>
        <path class="nf-star nf-star--3" d="M158 70 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3 z" fill="#f5c9a8"/>

        <!-- Ground -->
        <ellipse cx="100" cy="158" rx="74" ry="15" fill="url(#nfGround)"/>
        <ellipse cx="100" cy="156" rx="40" ry="7" fill="#ffc4a8" opacity="0.7"/>

        <!-- Post -->
        <rect x="95" y="66" width="10" height="88" rx="4" fill="url(#nfPost)"/>
        <rect x="95" y="66" width="4" height="88" rx="2" fill="#5a5a5a" opacity="0.55"/>

        <!-- Swinging sign -->
        <g class="nf-sign">
          <!-- hanger bar -->
          <rect x="98" y="58" width="4" height="16" rx="2" fill="#2b2b2b"/>
          <!-- board -->
          <g transform="translate(0,4)">
            <path d="M52 72 h80 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 H52 l-14 -16 z" fill="url(#nfBoard)"/>
            <path d="M52 72 h80 a6 6 0 0 1 6 6 v3 H52 z" fill="#ffffff" opacity="0.14"/>
            <!-- text on board -->
            <text x="92" y="96" text-anchor="middle" font-family="Heebo, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">LOST?</text>
            <!-- rivets -->
            <circle cx="58" cy="79" r="1.6" fill="#ffffff" opacity="0.55"/>
            <circle cx="58" cy="101" r="1.6" fill="#ffffff" opacity="0.55"/>
          </g>
        </g>

        <!-- little grass tufts -->
        <path d="M62 152 q2 -8 4 -10 q0 6 2 10 z" fill="#8fbf6b"/>
        <path d="M134 153 q2 -7 4 -9 q0 5 2 9 z" fill="#8fbf6b"/>
      </svg>
    </div>

    <div class="nf-code">4<span>0</span>4</div>
    <h1 class="nf-title">This page took a wrong turn</h1>
    <p class="nf-text">
      The page you're looking for doesn't exist, was moved, or the link is broken.
      Let's get you back on track.
    </p>

    <div class="nf-actions">
      <a href="{% if request.user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'index' %}{% endif %}" class="nf-btn nf-btn--primary">Back to Home</a>
      <a href="javascript:history.back()" class="nf-btn nf-btn--ghost">Go Back</a>
    </div>

    <p class="nf-help">
      Still stuck? <a href="{% url 'contact' %}">Contact support</a>
    </p>
   </div>
  </main>
</body>

</html>
