{% extends 'frontend/base/base.html' %}
{% load static %}

{% block extra_head %}
<link href="{% static 'css/billing/error.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid p-2">

    <!-- Page header -->
    <div
        style="display:flex; align-items:center; gap:8px; padding:10px 4px 12px; border-bottom:1px solid #e5e7eb; margin-bottom:16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2"
            stroke-linecap="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <path d="M2 10h20"></path>
        </svg>
        <span style="font-size:15px; font-weight:600; color:#111827;">Payment Error</span>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-5">
            <div class="billing-card">
                <div class="error-icon-wrap">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2.5"
                        stroke-linecap="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div style="font-size:17px; font-weight:700; color:#111827; margin-bottom:8px;">Something went wrong
                </div>
                <div style="font-size:13px; color:#6b7280; margin-bottom:16px;">
                    There was a problem processing your payment. No charge was made.
                </div>

                {% if error %}
                <div class="error-detail">{{ error }}</div>
                {% endif %}

                <div class="d-flex flex-column gap-2">
                    <a href="{% url 'billing:pricing' %}"
                        style="display:block; background:#111827; color:white; text-decoration:none; border-radius:6px; padding:10px; font-size:13px; font-weight:600;">
                        Try Again
                    </a>
                    <a href="/"
                        style="display:block; background:#fff; color:#374151; border:1px solid #d1d5db; text-decoration:none; border-radius:6px; padding:10px; font-size:13px; font-weight:500;">
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
