{% extends 'frontend/base/base.html' %}
{% load static %}

{% block extra_head %}
<link href="{% static 'css/billing/cancel.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid p-2">

    <!-- Page header -->
    <div
        style="display:flex; align-items:center; gap:8px; padding:10px 4px 12px; border-bottom:1px solid #e5e7eb; margin-bottom:16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2"
            stroke-linecap="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <path d="M2 10h20"></path>
        </svg>
        <span style="font-size:15px; font-weight:600; color:#111827;">Checkout Cancelled</span>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
            <div class="billing-card">
                <div class="cancel-icon-wrap">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"
                        stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
                <div style="font-size:17px; font-weight:700; color:#111827; margin-bottom:8px;">Checkout cancelled</div>
                <div style="font-size:13px; color:#6b7280; margin-bottom:28px;">
                    No charge was made. You can try again whenever you're ready.
                </div>

                <div class="d-flex flex-column gap-2">
                    <a href="{% url 'billing:pricing' %}"
                        style="display:block; background:#111827; color:white; text-decoration:none; border-radius:6px; padding:10px; font-size:13px; font-weight:600;">
                        Try Again
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
