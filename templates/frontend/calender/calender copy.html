{% extends 'frontend/base/base.html' %}
{% load static %}

{% block extra_head %}
<link href="{% static 'css/calender/grid.css' %}" rel="stylesheet">
{% endblock extra_head %}


{% block content %}
  <div class="top-bar">
    <button class="filters-btn">
      <span>⚙️</span>
      Filters
    </button>
    
    <div class="month-year-selector">
      <select class="month-dropdown" id="monthSelector" onchange="changeMonth()">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
      
      <select class="year-dropdown" id="yearSelector" onchange="changeYear()">
        <!-- Years will be populated by JavaScript -->
      </select>
    </div>

    <button class="nav-btn" onclick="goToPrevMonth()">‹</button>
    <button class="nav-btn" onclick="goToNextMonth()">›</button>
    <button class="today-btn" onclick="goToToday()">TODAY</button>
    <button class="nav-btn" onclick="refreshData()">↻</button>
    <button class="nav-btn">⊖</button>
    <button class="share-btn">Share</button>
  </div>

  
  <div class="calendar-container">
    <div class="loading-indicator" id="loadingIndicator">Loading...</div>
    <div class="calendar-wrapper">
      <div class="properties-column">
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="🔍 Search rentals..." />
  </div>
      <div id="propertiesList">
          <!-- Properties will be populated by JavaScript -->
        </div>
      </div>
      
      <div class="dates-scroll-container" id="datesContainer">
        <div class="dates-header" id="datesHeader">
          <!-- Date headers will be populated by JavaScript -->
        </div>
        <div class="dates-grid" id="datesGrid">
          <!-- Date grid will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>
{% endblock content %}

{% block extra_script %}

  <script>
    // Sample data with current year dates
    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth();

    const properties = {{ rooms_data|safe}}
    {% comment %} console.log(properties) {% endcomment %}

    const bookings = {{ bookings_data|safe }};

    bookings.forEach(b => {
      const [sy, sm, sd] = b.start_date.split('-').map(Number);
      const [ey, em, ed] = b.end_date.split('-').map(Number);
      b.startDate = new Date(sy, sm - 1, sd); // JS months are 0-based
      b.endDate = new Date(ey, em - 1, ed, 23, 59, 59, 999); 
    });

    {% comment %} const bookings = [
      { 
        propertyId: 1, 
        startDate: new Date(currentYear, currentMonth, 25), 
        endDate: new Date(currentYear, currentMonth, 28),
        guestName: 'Alex Johnson',
        guestAvatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop&crop=face'
      },
      
    ]; {% endcomment %}

    {% comment %} console.log("bookings==>",bookings) {% endcomment %}

    // Infinite scroll variables
    const DAYS_PER_BATCH = 30;
    const TOTAL_VISIBLE_DAYS = 120;
    let startDate = new Date();
    let allDates = [];
    let isLoading = false;

    // Initialize the start date to show past dates
    startDate.setDate(startDate.getDate() - 60);

    // Initialize year selector
    function initializeYearSelector() {
      const yearSelector = document.getElementById('yearSelector');
      const currentYear = new Date().getFullYear();
      
      for (let year = currentYear - 2; year <= currentYear + 5; year++) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        if (year === currentYear) option.selected = true;
        yearSelector.appendChild(option);
      }
    }

    // Generate continuous dates for infinite scroll
    function generateDates() {
      allDates = [];
      for (let i = 0; i < TOTAL_VISIBLE_DAYS; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        allDates.push(date);
      }
    }

    // Calculate price for a specific date and property
    function calculatePrice(property, date) {
      const isWeekend = date.getDay() === 0 || date.getDay() === 6;
      const basePrice = property.basePrice;
      return isWeekend ? Math.round(basePrice * property.weekendMultiplier) : basePrice;
    }

    // Check if property is booked on a specific date
    function isBooked(propertyId, date) {
      return bookings.find(booking => 
        booking.propertyId === propertyId &&
        date >= booking.startDate &&
        date <= booking.endDate
      );
    }

    // Get booking position within the span
    function getBookingPosition(propertyId, date) {
      const booking = isBooked(propertyId, date);
      if (!booking) return null;

      const isStart = date.toDateString() === booking.startDate.toDateString();
      const isEnd = date.toDateString() === booking.endDate.toDateString();
      
      if (isStart && isEnd) return 'single';
      if (isStart) return 'start';
      if (isEnd) return 'end';
      return 'middle';
    }

    // Get booking that spans multiple days
    function getBookingSpan(propertyId, dates) {
      const spans = [];
      bookings.forEach(booking => {
        if (booking.propertyId === propertyId) {
          const startIndex = dates.findIndex(date => 
            date >= booking.startDate && date <= booking.endDate
          );
          const endIndex = dates.findLastIndex(date => 
            date >= booking.startDate && date <= booking.endDate
          );
          
          if (startIndex !== -1) {
            spans.push({
              ...booking,
              startIndex: startIndex,
              endIndex: endIndex,
              length: endIndex - startIndex + 1
            });
          }
        }
      });
      return spans;
    }

    // Render properties column
    function renderProperties() {
      const propertiesList = document.getElementById('propertiesList');
      propertiesList.innerHTML = properties.map(property => `
        <div class="property-row">
          <div class="property-avatar"><img src="/media/${property.image}" alt="${property.title}" style="width:40px;height:40px;border-radius:50%;" /></div>
          <div class="property-info">
            <div class="property-name">${property.title}</div>
          </div>
          <div class="property-actions">⋮</div>
        </div>
      `).join('');
    }

    // Render dates header
    function renderDatesHeader() {
      const datesHeader = document.getElementById('datesHeader');
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      datesHeader.innerHTML = allDates.map(date => {
        const isToday = date.getTime() === today.getTime();
        const isFirstOfMonth = date.getDate() === 1;
        const isWeekend = date.getDay() === 0 || date.getDay() === 6;
        
        return `
          <div class="date-column ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">
            <div class="date-number">${date.getDate()}</div>
            <div class="date-day">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
            ${isFirstOfMonth ? `<div class="month-indicator">${date.toLocaleDateString('en-US', { month: 'short' })} ${date.getDate()}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // Render dates grid with enhanced booking visualization
    function renderDatesGrid() {
      const datesGrid = document.getElementById('datesGrid');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      datesGrid.innerHTML = properties.map(property => {
        const bookingSpans = getBookingSpan(property.id, allDates);
        
        const rowHtml = allDates.map((date, index) => {
          const price = calculatePrice(property, date);
          const booking = isBooked(property.id, date);
          const bookingPosition = getBookingPosition(property.id, date);
          const isWeekend = date.getDay() === 0 || date.getDay() === 6;
          const isPast = date < today;
          
          let cellClasses = 'date-cell';
          if (booking) {
            cellClasses += ' booked';
            if (bookingPosition === 'start' || bookingPosition === 'single') cellClasses += ' booking-start';
            if (bookingPosition === 'end' || bookingPosition === 'single') cellClasses += ' booking-end';
            if (bookingPosition === 'middle') cellClasses += ' booking-middle';
          }
          if (isWeekend) cellClasses += ' weekend';
          if (isPast) cellClasses += ' past-date';
          
          return `
            <div class="${cellClasses}" 
                 data-date="${date.toISOString()}" 
                 data-property="${property.id}"
                 onclick="selectDate('${date.toISOString()}', ${property.id})">
              <div class="price-amount">$${price.toLocaleString()}</div>
              ${!booking ? `<div class="availability-indicator"></div>` : ''}
              ${booking && bookingPosition === 'start' ? `<img class="guest-avatar" src="${booking.guestAvatar}" alt="${booking.guestName}" title="${booking.guestName}">` : ''}
            </div>
          `;
        }).join('');

        // Add enhanced booking spans for this property
        const bookingSpansHtml = bookingSpans.map(span => {
          if (span.startIndex >= 0 && span.endIndex < allDates.length) {
            const left = span.startIndex * 100;
            const width = (span.endIndex - span.startIndex + 1) * 100;
            return `
              <div class="booking-span" style="left: ${left}px; width: ${width}px;">
                <img src="${span.guestAvatar}" alt="${span.guestName}" title="${span.guestName}">
              </div>
            `;

          }
          return '';
        }).join('');

        return `<div class="date-row" style="position: relative;">${rowHtml}${bookingSpansHtml}</div>`;
      }).join('');
    }

    // Update current month display
    function updateCurrentMonthDisplay() {
      const container = document.getElementById('datesContainer');
      const scrollLeft = container.scrollLeft;
      const cellWidth = 100;
      const visibleDateIndex = Math.floor(scrollLeft / cellWidth);
      
      if (visibleDateIndex < allDates.length) {
        const visibleDate = allDates[visibleDateIndex];
        document.getElementById('monthSelector').value = visibleDate.getMonth();
        document.getElementById('yearSelector').value = visibleDate.getFullYear();
      }
    }

    // Handle infinite scrolling
    function handleScroll() {
      const container = document.getElementById('datesContainer');
      const scrollLeft = container.scrollLeft;
      const scrollWidth = container.scrollWidth;
      const clientWidth = container.clientWidth;

      // Load more dates when scrolling near the end
      if (scrollLeft + clientWidth > scrollWidth - 1000 && !isLoading) {
        loadMoreFutureDates();
      }

      // Load more dates when scrolling near the beginning
      if (scrollLeft < 1000 && !isLoading) {
        loadMorePastDates();
      }

      updateCurrentMonthDisplay();
    }

    // Load more future dates
    function loadMoreFutureDates() {
      isLoading = true;
      showLoadingIndicator();

      setTimeout(() => {
        const lastDate = allDates[allDates.length - 1];
        for (let i = 1; i <= DAYS_PER_BATCH; i++) {
          const newDate = new Date(lastDate);
          newDate.setDate(lastDate.getDate() + i);
          allDates.push(newDate);
        }
        
        renderDatesHeader();
        renderDatesGrid();
        hideLoadingIndicator();
        isLoading = false;
      }, 300);
    }

    // Load more past dates
    function loadMorePastDates() {
      isLoading = true;
      showLoadingIndicator();

      setTimeout(() => {
        const container = document.getElementById('datesContainer');
        const currentScrollLeft = container.scrollLeft;
        
        const firstDate = allDates[0];
        const newDates = [];
        for (let i = DAYS_PER_BATCH; i >= 1; i--) {
          const newDate = new Date(firstDate);
          newDate.setDate(firstDate.getDate() - i);
          newDates.push(newDate);
        }
        
        allDates = [...newDates, ...allDates];
        renderDatesHeader();
        renderDatesGrid();
        
        // Maintain scroll position
        container.scrollLeft = currentScrollLeft + (DAYS_PER_BATCH * 100);
        
        hideLoadingIndicator();
        isLoading = false;
      }, 300);
    }

    // Show/hide loading indicator
    function showLoadingIndicator() {
      document.getElementById('loadingIndicator').style.display = 'block';
    }

    function hideLoadingIndicator() {
      document.getElementById('loadingIndicator').style.display = 'none';
    }

    // Date selection handler
    function selectDate(dateString, propertyId) {
      const date = new Date(dateString);
      const property = properties.find(p => p.id === propertyId);
      const booking = isBooked(propertyId, date);
      
      if (booking) {
        alert(`This date is booked by ${booking.guestName}`);
      } else {
        alert(`Selected: ${property.name} on ${date.toLocaleDateString()}`);
      }
    }

    // Navigation functions
    function goToPrevMonth() {
      const container = document.getElementById('datesContainer');
      container.scrollLeft -= DAYS_PER_BATCH * 100;
    }

    function goToNextMonth() {
      const container = document.getElementById('datesContainer');
      container.scrollLeft += DAYS_PER_BATCH * 100;
    }

    function goToToday() {
      const today = new Date();
      const todayIndex = allDates.findIndex(date => 
        date.toDateString() === today.toDateString()
      );
      
      if (todayIndex !== -1) {
        const container = document.getElementById('datesContainer');
        container.scrollLeft = todayIndex * 100 - 500; // Center today
      }
    }

    function changeMonth() {
      const selectedMonth = parseInt(document.getElementById('monthSelector').value);
      const selectedYear = parseInt(document.getElementById('yearSelector').value);
      const targetDate = new Date(selectedYear, selectedMonth, 1);
      
      const targetIndex = allDates.findIndex(date => 
        date.getMonth() === targetDate.getMonth() && 
        date.getFullYear() === targetDate.getFullYear()
      );
      
      if (targetIndex !== -1) {
        const container = document.getElementById('datesContainer');
        container.scrollLeft = targetIndex * 100;
      }
    }

    function changeYear() {
      changeMonth(); // Use the same logic
    }

    function refreshData() {
      renderDatesGrid();
    }

    // Initialize calendar
    function init() {
      initializeYearSelector();
      renderProperties();
      generateDates();
      renderDatesHeader();
      renderDatesGrid();

      // Set initial scroll position to show current date
      const today = new Date();
      const todayIndex = allDates.findIndex(date => 
        date.toDateString() === today.toDateString()
      );
      
      if (todayIndex !== -1) {
        setTimeout(() => {
          const container = document.getElementById('datesContainer');
          container.scrollLeft = todayIndex * 100 - 500;
          updateCurrentMonthDisplay();
        }, 100);
      }

      // Add scroll listener
      document.getElementById('datesContainer').addEventListener('scroll', handleScroll);
    }

    // Start the application
    document.addEventListener('DOMContentLoaded', init);
  </script>
{% endblock extra_script %}
