<div class="modal fade" id="{{ modal_id|default:'confirmationModal' }}" tabindex="-1" aria-labelledby="{{ modal_id|default:'confirmationModal' }}Label" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="{{ modal_id|default:'confirmationModal' }}Label">{{ title|default:'Confirm Action' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" {% if body_id %}id="{{ body_id }}"{% endif %}>
        {{ message|default:'Are you sure you want to proceed?' }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ cancel_text|default:'Cancel' }}</button>
        <form id="{{ form_id|default:'confirmationForm' }}" method="post" style="display:inline;">
          {% csrf_token %}
          <button type="{{ confirm_btn_type|default:'submit' }}" class="btn {{ confirm_btn_class|default:'btn-danger' }}" id="{{ confirm_btn_id|default:'confirmBtn' }}">
            {{ confirm_text|default:'Confirm' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
