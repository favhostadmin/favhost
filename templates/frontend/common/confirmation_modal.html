<div class="modal fade" id="{{ modal_id|default:'confirmationModal' }}" tabindex="-1" aria-labelledby="{{ modal_id|default:'confirmationModal' }}Label" aria-hidden="true">
  <div class="modal-dialog modal-sm" role="document" style="max-width:380px;width:90%;margin:40px auto 0;">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-semibold" id="{{ modal_id|default:'confirmationModal' }}Label">{{ title|default:'Confirm Action' }}</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-2 pb-2" {% if body_id %}id="{{ body_id }}"{% endif %} style="font-size:14px;color:#374151;">
        {{ message|default:'Are you sure you want to proceed?' }}
      </div>
      <div class="modal-footer border-0 pt-0 d-flex flex-column gap-2">
        <form id="{{ form_id|default:'confirmationForm' }}" method="post" class="w-100">
          {% csrf_token %}
          <button type="{{ confirm_btn_type|default:'submit' }}" class="btn {{ confirm_btn_class|default:'btn-danger' }} btn-sm w-100" id="{{ confirm_btn_id|default:'confirmBtn' }}">
            {{ confirm_text|default:'Confirm' }}
          </button>
        </form>
        <button type="button" class="btn btn-secondary btn-sm w-100" data-bs-dismiss="modal">{{ cancel_text|default:'Cancel' }}</button>
      </div>
    </div>
  </div>
</div>
