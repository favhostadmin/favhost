{% load static %}
<form id="sendEmailForm" method="POST" action="{% url 'booking:send-guest-email' %}">
    {% csrf_token %}
    <input type="hidden" name="booking_id" value="{{ booking.id }}">
    
    <div class="modal-header" style="padding: 1rem; border-bottom: 1px solid #e5e7eb; justify-content: space-between; align-items: center; display: flex;">
        <h2 class="modal-title" style="font-size: 1.5rem; font-weight: 600; margin: 0;">Email Guest</h2>
    </div>

    <div class="modal-body" style="padding: 1.5rem; max-height: 60vh; overflow-y: auto;">
        <div class="form-group mb-3">
            <label class="form-label" style="display: block; margin-bottom: .5rem; font-weight: 500;">To:</label>
            <input type="text" class="form-input" style="width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" value="{{ booking.first_name }} {{ booking.last_name }} <{{ booking.email }}>" readonly>
        </div>

        <div class="form-group mb-3">
            <label for="emailSubject" class="form-label" style="display: block; margin-bottom: .5rem; font-weight: 500;">Subject<span style="color: red;">*</span></label>
            <input type="text" name="subject" id="emailSubject" class="form-input" style="width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" placeholder="Enter email subject" required>
        </div>

        <div class="form-group mb-3">
            <label for="emailMessage" class="form-label" style="display: block; margin-bottom: .5rem; font-weight: 500;">Message<span style="color: red;">*</span></label>
            <textarea name="message" id="emailMessage" class="form-input" style="width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" rows="8" placeholder="Write your message to {{ booking.first_name }}..." required></textarea>
        </div>
    </div>

    <div class="modal-footer" style="padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-cancel-email">Cancel</button>
        <button type="submit" class="btn btn-primary">Send Email</button>
    </div>
</form>
