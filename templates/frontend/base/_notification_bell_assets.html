{% comment %}
  Styles and behaviour for the header bell panel. Included once per page,
  while _notification_bell.html (the button + empty panel) is included twice:
  desktop actions and the mobile header.
{% endcomment %}
<style>
  .header-bell-wrap { position: relative; display: inline-flex; }

  /* ---------- panel shell ---------- */
  .nt-pop {
    position: absolute;
    top: calc(100% + 14px);
    right: -6px;
    z-index: 1060;
    width: min(460px, calc(100vw - 20px));
    background: #fff;
    border: 1px solid #E8EAEE;
    border-radius: 18px;
    box-shadow: 0 2px 6px rgba(16,24,40,.04), 0 22px 60px -12px rgba(16,24,40,.28);
    overflow: hidden;
    color: #1F2430;
    text-align: left;
    transform-origin: top right;
    animation: nt-pop-in .16s cubic-bezier(.2,.9,.3,1.2);
  }
  .nt-pop[hidden] { display: none; }
  @keyframes nt-pop-in {
    from { opacity: 0; transform: translateY(-6px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .nt-pop { animation: none; } }

  /* little arrow pointing back at the bell */
  .nt-pop::before {
    content: "";
    position: absolute; top: -7px; right: 22px;
    width: 13px; height: 13px;
    background: #fff;
    border-left: 1px solid #E8EAEE; border-top: 1px solid #E8EAEE;
    transform: rotate(45deg);
    border-radius: 3px 0 0 0;
  }

  /* ---------- header ---------- */
  .nt-pop__head {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 15px 18px 13px;
    background: linear-gradient(180deg, #FFF8F4 0%, #FFFFFF 100%);
    border-bottom: 1px solid #F0F1F4;
  }
  .nt-pop__title {
    font-size: 15.5px; font-weight: 800; letter-spacing: -.015em; color: #16151C;
  }
  .nt-pop__count {
    font-size: 10.5px; font-weight: 800; line-height: 1;
    background: #F15A24; color: #fff;
    border-radius: 999px; padding: 4px 8px;
  }
  .nt-pop__count[hidden] { display: none; }
  .nt-pop__readall {
    margin-left: auto;
    border: 0; background: none; padding: 4px 2px;
    font-size: 12.5px; font-weight: 700; color: #F15A24; cursor: pointer;
    border-radius: 6px;
  }
  .nt-pop__readall:hover { text-decoration: underline; }

  /* ---------- list ---------- */
  .nt-pop__body {
    max-height: min(560px, 68vh);
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .nt-pop__body::-webkit-scrollbar { width: 8px; }
  .nt-pop__body::-webkit-scrollbar-thumb { background: #E3E5E9; border-radius: 8px; border: 2px solid #fff; }

  .nt-pop__loading, .nt-pop__empty {
    padding: 44px 22px; text-align: center; color: #9AA1AC; font-size: 13px; line-height: 1.5;
  }
  .nt-pop__empty svg { width: 42px; height: 42px; color: #DDE0E5; margin-bottom: 12px; }
  .nt-pop__empty strong { display: block; color: #4B5563; font-weight: 800; margin-bottom: 5px; font-size: 14.5px; }

  .nt-pop__item {
    position: relative;
    display: flex; align-items: flex-start; gap: 13px;
    padding: 15px 18px 15px 15px;
    border-bottom: 1px solid #F4F5F7;
    text-decoration: none; color: inherit;
    transition: background .15s;
  }
  .nt-pop__item:last-child { border-bottom: 0; }
  .nt-pop__item::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
    width: 3px; border-radius: 0 3px 3px 0; background: transparent;
    transition: background .15s;
  }
  .nt-pop__item:hover { background: #FAFBFC; color: inherit; text-decoration: none; }
  .nt-pop__item.is-unread { background: #FFFCFA; }
  .nt-pop__item.kind-reservation:hover::before,
  .nt-pop__item.kind-reservation.is-unread::before { background: #2563EB; }
  .nt-pop__item.kind-enquiry:hover::before,
  .nt-pop__item.kind-enquiry.is-unread::before { background: #7C3AED; }

  .nt-pop__ico {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    display: grid; place-items: center;
  }
  .nt-pop__ico svg { width: 19px; height: 19px; }
  .kind-reservation .nt-pop__ico { background: #EFF6FF; color: #2563EB; }
  .kind-enquiry .nt-pop__ico { background: #F5F3FF; color: #7C3AED; }

  .nt-pop__txt { min-width: 0; flex: 1 1 auto; }
  /* The type sits on the box itself, so an item says what it is without a filter. */
  .nt-pop__tag {
    display: inline-block;
    font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 20px; border: 1px solid;
    margin-bottom: 6px;
  }
  .kind-reservation .nt-pop__tag { color: #1D4ED8; background: #EFF6FF; border-color: #C7DBFE; }
  .kind-enquiry .nt-pop__tag { color: #6D28D9; background: #F5F3FF; border-color: #DDD6FE; }

  .nt-pop__name { font-size: 13.5px; font-weight: 700; color: #16151C; line-height: 1.4; }
  .nt-pop__msg {
    font-size: 12.5px; color: #6B7280; margin-top: 3px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .nt-pop__meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 8px; font-size: 11px; color: #9AA1AC;
  }
  .nt-pop__chan {
    background: #F5F6F8; border: 1px solid #E7E9ED; border-radius: 20px;
    padding: 2px 8px; font-weight: 700; color: #6B7280;
  }
  .nt-pop__dot {
    width: 8px; height: 8px; border-radius: 50%; background: #F15A24;
    flex: 0 0 auto; margin-top: 7px;
    box-shadow: 0 0 0 3px rgba(241,90,36,.14);
  }

  @media (max-width: 991.98px) {
    /* The mobile header sits at the screen edge; anchor the panel to the
       viewport instead so it can't hang off the right. */
    .nt-pop { position: fixed; top: 64px; right: 10px; left: auto; width: calc(100vw - 20px); }
    .nt-pop::before { right: 26px; }
    .nt-pop__body { max-height: 70vh; }
  }
</style>

<script>
/* Bell dropdown. Included twice (desktop + mobile header), so this binds once
   and drives every instance on the page. */
(function () {
  if (window.__favhostBellReady) return;
  window.__favhostBellReady = true;

  var FEED = "{% url 'booking:notification-feed' %}";
  var READ_ALL = "{% url 'booking:notification-read-all' %}";

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function csrf() {
    var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var ICONS = {
    reservation: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>'
      + '<line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    enquiry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
  };

  function renderItem(n) {
    var kind = n.kind === 'reservation' ? 'reservation' : 'enquiry';
    return '<a class="nt-pop__item kind-' + kind + (n.is_read ? '' : ' is-unread') + '" href="' + esc(n.url) + '">'
      + '<span class="nt-pop__ico">' + ICONS[kind] + '</span>'
      + '<span class="nt-pop__txt">'
      +   '<span class="nt-pop__tag">' + esc(n.kind_label) + '</span>'
      +   '<span class="nt-pop__name d-block">' + esc(n.title) + '</span>'
      +   (n.message ? '<span class="nt-pop__msg d-block">' + esc(n.message) + '</span>' : '')
      +   '<span class="nt-pop__meta">'
      +     (n.channel ? '<span class="nt-pop__chan">' + esc(n.channel) + '</span>' : '')
      +     (n.property ? '<span>' + esc(n.property) + '</span>' : '')
      +     '<span>&middot; ' + esc(n.ago) + '</span>'
      +   '</span>'
      + '</span>'
      + (n.is_read ? '' : '<span class="nt-pop__dot"></span>')
      + '</a>';
  }

  function setBadges(count) {
    document.querySelectorAll('.js-bell-badge').forEach(function (b) {
      b.textContent = count > 99 ? '99+' : count;
      b.hidden = !count;
    });
    document.querySelectorAll('.js-bell-popcount').forEach(function (p) {
      p.textContent = count + ' new';
      p.hidden = !count;
    });
  }

  function load(pop) {
    var body = pop.querySelector('.js-bell-body');
    var readAll = pop.querySelector('.js-bell-readall');
    body.innerHTML = '<div class="nt-pop__loading">Loading&hellip;</div>';
    fetch(FEED, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var items = data.items || [];
        body.innerHTML = items.length
          ? items.map(renderItem).join('')
          : '<div class="nt-pop__empty">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" '
            + 'stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>'
            + '<path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
            + '<strong>Nothing yet</strong>'
            + 'Reservations from your connected channels and guest enquiries land here.</div>';
        if (readAll) readAll.hidden = !data.unread;
        var pill = pop.querySelector('.js-bell-popcount');
        if (pill) { pill.textContent = (data.unread || 0) + ' new'; pill.hidden = !data.unread; }
        setBadges(data.unread || 0);
      })
      .catch(function () {
        body.innerHTML = '<div class="nt-pop__empty"><strong>Could not load</strong>Please try again.</div>';
      });
  }

  function closeAll(except) {
    document.querySelectorAll('.js-bell-pop').forEach(function (p) {
      if (p !== except) {
        p.hidden = true;
        var t = p.parentElement.querySelector('.js-bell-toggle');
        if (t) t.setAttribute('aria-expanded', 'false');
      }
    });
  }

  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('.js-bell-toggle');
    if (toggle) {
      e.preventDefault();
      var pop = toggle.parentElement.querySelector('.js-bell-pop');
      var opening = pop.hidden;
      closeAll(pop);
      pop.hidden = !opening;
      toggle.setAttribute('aria-expanded', opening ? 'true' : 'false');
      if (opening) load(pop);
      return;
    }

    var readAll = e.target.closest('.js-bell-readall');
    if (readAll) {
      e.preventDefault();
      var pop2 = readAll.closest('.js-bell-pop');
      fetch(READ_ALL, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrf() }
      }).then(function () { load(pop2); });
      return;
    }

    /* A click anywhere else dismisses -- but not inside the panel, where the
       items are links that need to navigate. */
    if (!e.target.closest('.js-bell-pop')) closeAll(null);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAll(null);
  });
})();
</script>
