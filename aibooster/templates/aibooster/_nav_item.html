{# One item for the public landing-page navbar. Reuses the theme's own .has-sub-menu / .ul-header-submenu styles. #}
<div class="has-sub-menu">
    <a href="#" onclick="event.preventDefault();">AI Booster</a>
    <ul class="ul-header-submenu">
        <li><a class="ab-sub" href="{% url 'aibooster:image' %}">Image Booster</a></li>
        <li><a class="ab-sub" href="{% url 'aibooster:report' %}">Boost Report</a></li>
    </ul>
</div>
<style>
    /* The landing pages force every nav link white when the header is scrolled;
       keep dropdown links readable on the dropdown's white panel. */
    .ul-header-bottom .ul-header-nav .ul-header-submenu li a.ab-sub { color: #111 !important; }
    .ul-header-bottom .ul-header-nav .ul-header-submenu li a.ab-sub:hover { color: var(--ul-primary) !important; }
    /* In the mobile sidebar (dark) the submenu must be transparent with white links. */
    .ul-sidebar .ul-header-nav .ul-header-submenu { background: transparent !important; box-shadow: none !important; }
</style>
