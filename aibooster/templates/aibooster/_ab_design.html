{% load static %}
<style>
  /* Shared look for the AI Studio pages (Photo Enhancer + Listing Audit).
     Everything is scoped under .ab-page so it can't leak into the host layout. */
  .ab-page { --ab-orange: #EB5310; --ab-orange-dark: #d44a0e; --ab-amber: #ff8a1f; --ab-navy: #1E252F; --ab-ink: #0f172a; --ab-muted: #64748b; --ab-line: #e5e7eb;
    color: var(--ab-ink); font-size: 15px; line-height: 1.55; flex: 1 0 auto; background: #fff; overflow-x: clip; }
  .ab-page *, .ab-page *::before, .ab-page *::after { box-sizing: border-box; }
  :where(.ab-page) :where(h1, h2, h3, p) { font-family: inherit; margin: 0; }   /* zero specificity: class margins below still win */
  .ab-page a { text-decoration: none; }
  .ab-svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .ab-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .ab-muted { color: var(--ab-muted); font-size: 13px; }

  /* ---------- buttons / notices ---------- */
  .ab-btn { background: linear-gradient(90deg, var(--ab-orange), #ff6a2b); border: none; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: filter .15s, transform .15s; box-shadow: 0 8px 20px rgba(235,83,16,.28); }
  .ab-btn:hover { filter: brightness(.94); color: #fff; }
  .ab-btn:disabled { opacity: .6; cursor: default; }
  .ab-notice { display: none; margin: 16px 0 0; border-radius: 12px; }

  /* ---------- top band (keeps the public header readable) + hero ---------- */
  .ab-topband { height: clamp(76px, 4.52vw, 86px); background: #1e1e1e; }   /* same solid colour as the logged-in header */
  .ab-hero { position: relative; padding: 64px 0 88px; background: radial-gradient(900px 480px at 88% 8%, #fff1e8 0%, rgba(255,241,232,0) 70%), radial-gradient(700px 400px at 0% 100%, #f5f7fb 0%, rgba(245,247,251,0) 70%), #fff; }
  .ab-hero-grid { display: grid; grid-template-columns: 1fr 1.02fr; gap: 64px; align-items: center; }
  .ab-hero-grid > * { min-width: 0; }
  .ab-h1 { font-size: clamp(38px, 5.2vw, 72px); font-weight: 800; line-height: 1.04; letter-spacing: -.03em; color: var(--ab-ink); }
  .ab-h1 em { font-style: normal; display: block; color: var(--ab-orange); }
  .ab-lead { margin-top: 26px; font-size: 19px; line-height: 1.7; color: #475569; max-width: 560px; }

  .ab-urlrow { display: flex; gap: 10px; background: #fff; border: 1px solid var(--ab-line); border-radius: 18px; padding: 10px; margin-top: 34px; box-shadow: 0 8px 30px rgba(15,23,42,.07); }
  .ab-urlfield { flex: 1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #f3f4f7; border-radius: 12px; min-width: 0; color: #94a3b8; margin: 0; }
  .ab-urlfield input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 15px 0; min-width: 0; color: var(--ab-ink); font-family: inherit; }
  .ab-urlfield input::placeholder { color: #94a3b8; }
  .ab-urlrow .ab-btn { white-space: nowrap; padding: 0 26px; }
  .ab-below { margin-top: 16px; font-size: 14.5px; color: var(--ab-muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .ab-link { color: var(--ab-orange); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; font-size: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .ab-link:hover { color: var(--ab-orange-dark); }
  .ab-link .ab-svg { width: 16px; height: 16px; }
  .ab-trust { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--ab-muted); }
  .ab-trust span { display: inline-flex; align-items: center; gap: 7px; }
  .ab-trust .ab-svg { width: 15px; height: 15px; color: #16a34a; }
  .ab-quota { margin-top: 12px; font-size: 13px; color: #94a3b8; }

  /* upload / manual boxes inside the hero */
  .ab-dropwrap { margin-top: 14px; }
  .ab-drop { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; background: #fafbfc; color: var(--ab-ink); }
  .ab-drop.ab-over { border-color: var(--ab-orange); background: #fff7f3; }
  .ab-drop strong { color: var(--ab-orange); }
  .ab-files { margin-top: 8px; font-size: 13px; color: var(--ab-ink); }
  .ab-textarea { width: 100%; border: 1px solid var(--ab-line); outline: 0; border-radius: 16px; padding: 14px 16px; font-size: 14.5px; font-family: inherit; resize: vertical; min-height: 130px; color: var(--ab-ink); background: #fff; }
  .ab-textarea:focus { border-color: var(--ab-orange); box-shadow: 0 0 0 3px rgba(235,83,16,.12); }

  /* hero visual: a "what you get" card when there is no before/after sample yet */
  .ab-visual { background: #fff; border: 1px solid var(--ab-line); border-radius: 28px; padding: 32px; box-shadow: 0 24px 70px rgba(15,23,42,.10); }
  .ab-visual h3 { font-size: 18px; font-weight: 800; margin-bottom: 18px; color: var(--ab-ink); }
  .ab-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  .ab-checks li { display: flex; gap: 14px; color: var(--ab-muted); font-size: 15px; }
  .ab-checks li .ab-svg { width: 22px; height: 22px; color: var(--ab-orange); margin-top: 1px; }
  .ab-checks b { color: var(--ab-ink); display: block; font-weight: 700; }
  .ab-phold { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .ab-phold div { aspect-ratio: 4 / 3; border-radius: 16px; background: #f1f5f9; border: 2px dashed #cbd5e1; display: grid; place-items: center; text-align: center; color: #94a3b8; font-size: 13px; font-weight: 600; padding: 10px; }
  .ab-phold div:last-child { background: #fff7f3; border-color: #f7b794; color: var(--ab-orange); }

  /* ---------- before / after slider ---------- */
  .ab-ba { --pos: 50%; position: relative; border-radius: 28px; aspect-ratio: 3 / 2; background: #111; user-select: none; box-shadow: 0 30px 80px rgba(15,23,42,.22); }
  /* The moving parts live in their own GPU layer so dragging never repaints the big blurred shadow
     (that repaint is what made the picture lag behind the handle). */
  .ab-ba-stage { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; transform: translateZ(0); will-change: transform; contain: paint; touch-action: pan-y; }
  .ab-ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  /* The site theme sets `img { transition: .4s ease }` (all properties), which made the picture glide to the
     handle's position instead of following it. The slider must follow the pointer instantly. */
  .ab-ba img, .ab-ba-line, .ab-ba-knob { transition: none !important; }
  .ab-ba .ab-ba-before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); will-change: clip-path; }
  .ab-ba-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; pointer-events: none; will-change: left; }
  .ab-ba-knob { position: absolute; top: 50%; left: clamp(25px, var(--pos), calc(100% - 25px)); width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: #fff; color: var(--ab-ink);
    display: grid; place-items: center; box-shadow: 0 6px 22px rgba(0,0,0,.3); pointer-events: none; font-weight: 700; font-size: 18px; }
  .ab-ba-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ab-ba-tag { position: absolute; top: 18px; padding: 6px 15px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; pointer-events: none; }
  .ab-ba-tag.b { left: 18px; background: rgba(30,37,47,.88); }
  .ab-ba-tag.a { right: 18px; background: #10b981; }
  .ab-ba-note { margin-top: 12px; text-align: center; font-size: 13px; color: #94a3b8; }

  /* ---------- result (Photo Enhancer): the preview is the same drag slider as the hero ---------- */
  .ab-ba-result { aspect-ratio: 3 / 2; background: #e5e7eb; box-shadow: 0 14px 40px rgba(15,23,42,.14); border-radius: 20px; }
  .ab-ba-busy { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: rgba(15,23,42,.55); color: #fff; text-align: center; padding: 16px; font-weight: 600; }
  .ab-ba-busy .ab-spin { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  .ab-ba-busy small { font-weight: 400; opacity: .85; }
  .ab-ba-busy.bad { background: rgba(127,29,29,.88); }
  /* strip of every photo in the batch, under the preview (click one to load it into the slider) */
  .ab-thumbs { margin-top: 16px; border: 1px solid var(--ab-line); border-radius: 16px; padding: 14px; background: #fafbfc; }
  .ab-thumbs-h { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 12px; }
  .ab-thumb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .ab-thumb { display: block; width: 100%; padding: 0; margin: 0; background: #fff; border: 2px solid transparent; border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left;
    box-shadow: 0 1px 4px rgba(15,23,42,.10); font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .ab-thumb:hover { box-shadow: 0 4px 14px rgba(15,23,42,.16); }
  .ab-thumb.on { border-color: var(--ab-orange); box-shadow: 0 0 0 3px rgba(235,83,16,.16); }
  .ab-thumb .im { position: relative; aspect-ratio: 3 / 2; background: #e5e7eb; }
  .ab-thumb .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ab-thumb.dim .im img { opacity: .5; }
  .ab-thumb .st { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(15,23,42,.78); color: #fff; }
  .ab-thumb .st.ok { background: #10b981; } .ab-thumb .st.bad { background: #dc2626; } .ab-thumb .st.wait { background: rgba(15,23,42,.78); } .ab-thumb .st.busy { background: var(--ab-orange); }
  .ab-thumb .cap { padding: 7px 9px; font-size: 12.5px; font-weight: 700; color: #1f2937; }
  .ab-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-top: 16px; }
  .ab-btn.line { background: #fff; color: var(--ab-orange); border: 2px solid var(--ab-orange); box-shadow: none; }
  .ab-btn.line:hover { background: #fff7f3; filter: none; }

  /* ---------- result (Photo Enhancer) ---------- */
  .ab-result-sec { display: none; background: #FAFAFA; padding: 56px 0; border-top: 1px solid var(--ab-line); border-bottom: 1px solid var(--ab-line); }
  .ab-result-sec h2 { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 22px; }
  .ab-job { background: #fff; border: 1px solid var(--ab-line); border-radius: 20px; padding: 16px; box-shadow: 0 10px 34px rgba(15,23,42,.06); }
  .ab-result { max-width: 780px; margin: 0 auto; }
  .ab-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ab-pane { position: relative; background: #f3f4f6; border-radius: 14px; aspect-ratio: 3 / 2; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .ab-pane img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ab-tag { position: absolute; top: 10px; left: 10px; background: rgba(15,23,42,.8); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; z-index: 1; }
  .ab-state { font-size: 13px; color: var(--ab-muted); text-align: center; padding: 8px; }
  .ab-state.ab-bad { color: #b91c1c; }
  .ab-spin { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: var(--ab-orange); border-radius: 50%; animation: ab-rot .8s linear infinite; margin: 0 auto 8px; }
  @keyframes ab-rot { to { transform: rotate(360deg); } }
  .ab-summary { margin-top: 14px; font-size: 14.5px; color: #334155; }
  .ab-foot { display: flex; justify-content: flex-end; margin-top: 14px; }

  /* ---------- content sections ---------- */
  .ab-sec { padding: 96px 0; }
  .ab-sec.ab-soft { background: #f8fafc; }
  .ab-sec-head { text-align: center; max-width: 760px; margin: 0 auto 52px; }
  .ab-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--ab-orange); background: #fff; border: 1px solid #fbd9c7; box-shadow: 0 2px 10px rgba(235,83,16,.08); margin-bottom: 18px; }
  .ab-pill .ab-svg { width: 16px; height: 16px; }
  .ab-pill.green { color: #047857; border-color: #a7f3d0; background: #ecfdf5; box-shadow: none; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; }
  .ab-sec-head h2 { font-size: clamp(30px, 4vw, 52px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; color: var(--ab-ink); }
  .ab-sec-head h2 em { font-style: normal; color: var(--ab-orange); }
  .ab-sec-head p { margin-top: 16px; font-size: 19px; color: var(--ab-muted); }
  .ab-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .ab-feat { background: #fff; border: 1px solid var(--ab-line); border-radius: 24px; padding: 32px; box-shadow: 0 6px 24px rgba(15,23,42,.05); transition: box-shadow .2s, transform .2s; }
  .ab-feat:hover { box-shadow: 0 18px 44px rgba(15,23,42,.10); transform: translateY(-3px); }
  .ab-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; margin-bottom: 20px; }
  .ab-ico.g { background: #10b981; } .ab-ico.o { background: #f43f5e; } .ab-ico.b { background: #4f6bff; } .ab-ico.v { background: #8b5cf6; } .ab-ico.a { background: #f59e0b; } .ab-ico.t { background: #14b8a6; } .ab-ico.or { background: var(--ab-orange); }
  .ab-ico.round { border-radius: 50%; }
  .ab-ico.round.y { background: #fff7e0; color: #f59e0b; } .ab-ico.round.gr { background: #e8faf1; color: #10b981; } .ab-ico.round.bl { background: #eaf0ff; color: #3b6bff; }
  .ab-feat h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--ab-ink); }
  .ab-feat p { color: var(--ab-muted); font-size: 15.5px; line-height: 1.65; }
  .ab-step-n { font-size: 52px; font-weight: 800; line-height: 1; margin-bottom: 14px; background: linear-gradient(90deg, var(--ab-orange), var(--ab-amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* bento gallery (hover / tap a tile to reveal the enhanced version) */
  .ab-bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px; }
  .ab-tile { position: relative; border-radius: 26px; overflow: hidden; min-height: 280px; background: #111; cursor: pointer; margin: 0; }
  .ab-tile:nth-child(1) { grid-column: span 4; grid-row: span 2; min-height: 580px; }
  .ab-tile:nth-child(n+2) { grid-column: span 2; }
  .ab-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s ease; }
  .ab-tile .ab-t-after { opacity: 0; }
  .ab-tile:hover .ab-t-after, .ab-tile.on .ab-t-after { opacity: 1; }
  .ab-tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(15,23,42,.88) 0%, rgba(15,23,42,.35) 36%, rgba(15,23,42,0) 62%); pointer-events: none; }
  .ab-t-badge { position: absolute; top: 16px; left: 16px; z-index: 2; padding: 6px 15px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(30,37,47,.88); transition: background .3s; }
  .ab-tile:hover .ab-t-badge, .ab-tile.on .ab-t-badge { background: #10b981; }
  .ab-t-badge .a { display: none; }
  .ab-tile:hover .ab-t-badge .b, .ab-tile.on .ab-t-badge .b { display: none; }
  .ab-tile:hover .ab-t-badge .a, .ab-tile.on .ab-t-badge .a { display: inline; }
  .ab-t-cap { position: absolute; z-index: 2; left: 24px; right: 24px; bottom: 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; color: #fff; }
  .ab-t-cap b { display: block; font-size: 24px; font-weight: 800; line-height: 1.15; }
  .ab-t-cap div span { font-size: 14.5px; opacity: .85; }
  .ab-tile:hover .ab-t-cap span, .ab-tile.on .ab-t-cap div span { color: #6ee7b7; opacity: 1; }
  .ab-t-cap .e { display: none; }
  .ab-tile:hover .ab-t-cap .e, .ab-tile.on .ab-t-cap .e { display: inline; }
  .ab-tile:hover .ab-t-cap .h, .ab-tile.on .ab-t-cap .h { display: none; }
  .ab-t-go { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); display: grid; place-items: center; flex: 0 0 auto; transition: background .3s; }
  .ab-tile:hover .ab-t-go, .ab-tile.on .ab-t-go { background: #10b981; border-color: #10b981; }
  /* fill the grid cleanly whatever the number of tiles (1-6) */
  .ab-bento.n1 .ab-tile { grid-column: span 6; grid-row: auto; min-height: 480px; }
  .ab-bento.n2 .ab-tile { grid-column: span 3; grid-row: auto; min-height: 420px; }
  .ab-bento.n4 .ab-tile:nth-child(4) { grid-column: span 6; min-height: 320px; }
  .ab-bento.n5 .ab-tile:nth-child(n+4) { grid-column: span 3; min-height: 320px; }
  .ab-center { text-align: center; margin-top: 44px; }

  /* promise band */
  .ab-promise { padding: 96px 0; background: linear-gradient(180deg, #fff 0%, #f1fbf6 100%); text-align: center; }
  .ab-promise .ab-badge { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; display: grid; place-items: center; margin: 0 auto 24px; box-shadow: 0 0 0 14px rgba(16,185,129,.14); }
  .ab-promise .ab-badge .ab-svg { width: 42px; height: 42px; }
  .ab-promise h2 { margin-top: 18px; font-size: clamp(34px, 5vw, 62px); font-weight: 800; letter-spacing: -.03em; color: var(--ab-ink); }
  .ab-promise h2 em { font-style: normal; color: #059669; }
  .ab-promise .ab-sub { margin: 16px auto 48px; max-width: 640px; font-size: 19px; color: var(--ab-muted); }
  .ab-grid3.tight { max-width: 1000px; margin: 0 auto; gap: 22px; }
  .ab-grid3.tight .ab-feat { text-align: center; padding: 28px 24px; border-radius: 20px; }
  .ab-grid3.tight .ab-ico { margin: 0 auto 16px; width: 52px; height: 52px; background: #e8faf1; color: #10b981; border-radius: 14px; }

  /* FAQ (native <details>: no JS, works in both layouts) */
  .ab-faq-list { max-width: 800px; margin: 0 auto; display: grid; gap: 14px; }
  .ab-faq { background: #fff; border: 1px solid var(--ab-line); border-radius: 16px; padding: 0 24px; }
  .ab-faq summary { cursor: pointer; list-style: none; padding: 20px 0; font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .ab-faq summary::-webkit-details-marker { display: none; }
  .ab-faq summary::after { content: '+'; font-size: 24px; color: var(--ab-orange); line-height: 1; }
  .ab-faq[open] summary::after { content: '–'; }
  .ab-faq p { padding: 0 0 20px; color: var(--ab-muted); }

  /* dark call-to-action band */
  .ab-dark { background: #0f172a; color: #fff; text-align: center; padding: 96px 0; }
  .ab-dark .ab-pill { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); box-shadow: none; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
  .ab-dark h2 { font-size: clamp(30px, 4.4vw, 56px); font-weight: 800; letter-spacing: -.025em; line-height: 1.12; color: #fff; max-width: 820px; margin: 0 auto; }
  .ab-dark p { margin: 18px auto 34px; max-width: 620px; font-size: 19px; color: rgba(255,255,255,.72); }
  .ab-dark .ab-btn { padding: 16px 34px; font-size: 17px; border-radius: 14px; }
  .ab-dark .ab-btn.alt { background: transparent; box-shadow: none; border: 2px solid rgba(255,255,255,.5); }
  .ab-dark .ab-btn.alt:hover { background: rgba(255,255,255,.1); filter: none; }
  .ab-cta-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

  /* floating "paste your link" bar */
  .ab-sticky { position: fixed; left: 50%; bottom: 18px; width: min(780px, calc(100% - 24px)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 1040; background: #fff; border-radius: 999px; padding: 7px; box-shadow: 0 14px 50px rgba(15,23,42,.28); border: 1px solid var(--ab-line); }
  .ab-sticky.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .ab-sticky form { display: flex; gap: 8px; align-items: center; margin: 0; }
  .ab-sticky .ab-urlfield { background: transparent; }
  .ab-sticky .ab-btn { border-radius: 999px; padding: 12px 24px; white-space: nowrap; }

  /* download modal bits */
  .ab-consent { font-size: 12px; color: var(--ab-muted); }

  /* ---------- Platform look (matches the Favhost site: Manrope, pill buttons, cream + orange, soft shadows) ---------- */
  .ab-page { --ab-cream: #FFF9F4; --ab-grad: linear-gradient(90deg, #EB5310 0%, #FAA019 100%); background: #fff; }
  .ab-btn { height: 54px; padding: 0 8px 0 24px; border-radius: 999px; background: var(--ab-orange); border: 1px solid transparent; box-shadow: none; font-weight: 800; font-size: 15.5px; gap: 12px; transition: all .3s ease; }
